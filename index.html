<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마음 다리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
/* VOICE: 다정하고 조용하게 — 아이가 겁먹지 않는 말투, 선생님 화면은 차분한 정리
   IDEA: 두 언덕을 잇는 다리 — 이야기를 들려준 친구들과 대화할 친구의 마음이 선생님을 통해 오가는 길
   PICTURE: 첫 화면의 다리 그림, 진행 중에는 크게 누르는 카드 자체가 그림
   COLOUR and TYPE: 노을빛 살구 바탕, 산호색 강조, 짙은 청록 보조 / Jua 제목 + Gowun Dodum 본문
   LAYOUT: 한 열, 큰 탭 버튼, 태블릿 기준 폭 760px */
:root{color-scheme:light dark;--bg:light-dark(#fff4e8,#1c191f);--ink:light-dark(#2d2522,#f3ece6);--soft:light-dark(#ffe3c9,#2d2730);--card:light-dark(#fff,#262229);--line:light-dark(#f0d6bf,#3b3440);--pri:light-dark(#e2553d,#ff7d64);--sup:light-dark(#1f5f6b,#80c7d1);--mut:light-dark(#7b6a61,#b5aaa2)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 "Gowun Dodum",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,.jua{font-family:Jua,"Gowun Dodum",sans-serif;font-weight:400;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(36px,7vw,52px)}h2{font-size:clamp(26px,4.6vw,34px)}h3{font-size:20px}
.wrap{max-width:760px;margin:0 auto;padding:clamp(20px,4vw,40px) max(4vw,16px) 60px}
.hero{background:var(--soft);border-radius:28px;padding:24px;display:grid;gap:14px}
.hero svg{width:100%;height:auto;display:block}
p{margin:.4em 0}.mut{color:var(--mut);font-size:15px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{min-height:56px;border:0;border-radius:18px;padding:12px 24px;font-family:Jua,sans-serif;font-size:21px;background:var(--pri);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.sup{background:var(--sup);color:light-dark(#fff,#13262a)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.sm{min-height:44px;font-size:17px;padding:8px 16px}
:focus-visible{outline:3px solid var(--sup);outline-offset:3px}
.row2{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.hold{position:relative;overflow:hidden;min-height:44px;border:2px dashed var(--line);background:none;border-radius:14px;padding:6px 16px;color:var(--mut);font-size:15px;touch-action:none;user-select:none;-webkit-user-select:none}
.hold i{position:absolute;inset:0;width:0;background:var(--soft);z-index:-1;transition:width 0s}
.hold.on i{width:100%;transition:width 1.4s linear}
.dots{display:flex;gap:6px;margin:4px 0 18px}.dots i{height:8px;flex:1;border-radius:4px;background:var(--line)}.dots i.on{background:var(--pri)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:12px;margin:22px 0}
.grid.face{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.chip{min-height:72px;border:2px solid var(--line);background:var(--card);border-radius:20px;padding:12px 16px;text-align:left;font-size:19px;line-height:1.35;transition:transform .12s}
.chip.big{text-align:center;font-size:20px}.chip.big b{display:block;font-size:40px;line-height:1.2;font-weight:400}
.chip[aria-pressed=true]{background:var(--pri);border-color:var(--pri);color:#fff}
.chip:active{transform:scale(.97)}
textarea{width:100%;min-height:130px;font:inherit;font-size:18px;padding:14px;border-radius:18px;border:2px solid var(--line);background:var(--card);color:var(--ink);margin:18px 0}
.wl{display:block;font-family:Jua,sans-serif;font-size:19px;margin-top:6px}textarea.w{min-height:96px;margin-top:8px}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:10px}
.say{background:var(--card);border:2px solid var(--line);border-radius:22px 22px 22px 6px;padding:14px 18px;font-size:19px;margin:10px 0}
.tag{display:inline-block;background:var(--soft);border-radius:999px;padding:4px 14px;margin:4px 6px 4px 0;font-size:16px}
.good{background:light-dark(#e3f1f3,#1f3236);border-color:transparent}
.box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 20px;margin:16px 0}
.stat{display:flex;gap:28px;flex-wrap:wrap}.stat b{font-family:Jua;font-size:40px;display:block;line-height:1}
.br{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 2em;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:16px}
.br:first-of-type{border-top:0}.br label{display:flex;gap:8px;align-items:center}
.br input{width:22px;height:22px;accent-color:var(--pri);flex:none}
.bar{height:12px;background:var(--soft);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--sup);border-radius:6px}
.br b{text-align:right;font-variant-numeric:tabular-nums}
details{border-top:1px solid var(--line);padding:10px 0}summary{cursor:pointer;font-size:17px;min-height:32px}
.lock{font-size:14px;color:var(--mut)}
.pcard{background:var(--card);border:3px solid var(--pri);border-radius:28px;padding:26px;display:grid;gap:18px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px}
.cols>div{background:var(--soft);border-radius:18px;padding:16px}
ul{margin:.4em 0;padding-left:1.2em}li{margin:.25em 0}
.pinw{max-width:420px;margin:0 auto;text-align:center}.pdots{display:flex;gap:14px;justify-content:center;margin:18px 0 22px}.pdots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--pri)}.pdots i.on{background:var(--pri)}
.pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.pad .chip{min-height:72px;font-size:26px;font-family:Jua,sans-serif}
.cname{width:100%;max-width:320px;font:inherit;font-size:18px;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);margin-top:6px}
.imgw{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:16px;z-index:9}.imgw>div{background:var(--card);border-radius:22px;padding:16px;max-width:520px;width:100%;max-height:100%;overflow:auto;display:grid;gap:12px}.imgw img{width:100%;border-radius:14px;display:block}
.toast{z-index:10;position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:14px;font-size:16px}
@media(prefers-reduced-motion:reduce){.hold.on i{transition:none}.chip{transition:none}}
@media(max-width:600px){.br{grid-template-columns:minmax(0,1fr) 70px 2em}}
</style>
</head>
<body>

<script>
{

const FEEL=['😨 무서웠어','😢 속상했어','😣 답답했어','😠 화가 났어','😶 말이 안 나왔어','🙂 조금 괜찮았어'];
const WISH=['내 의견도 물어봐 줘','목소리를 조금 낮춰 줘','실수해도 괜찮다고 해 줘','다 같이 정하자','내 말을 끝까지 들어 줘','져도 화내지 말아 줘'];

const B_FEEL=['😮 몰랐어','😳 깜짝 놀랐어','😔 미안해','😕 조금 억울해','🤔 생각해 볼게'];
const B_WHY=['이기고 싶어서 그랬어','빨리 정해야 할 것 같았어','친구들이 말을 안 해서 내가 정했어','그렇게 무서운 줄 몰랐어','장난이었는데 오해가 생겼어','잘 모르겠어'];

const G=[
 {k:'ani',q:'오늘 나는 어떤 동물로 할까?',sub:'이름 대신 쓸 동물을 하나 골라 줘.',t:'one',o:ANI,face:1},
 {k:'when',q:'언제 마음이 힘들었어?',sub:'여러 개 골라도 되고, 직접 써도 돼.',t:'multi',o:WHEN,w:'예: 피구할 때 공을 누가 던질지 정할 때'},
 {k:'what',q:'그때 어떤 일이 있었어?',sub:'생각나는 걸 고르거나 직접 써 줘.',t:'multi',o:WHAT,w:'그때 있었던 일을 내 말로 써 봐'},
 {k:'feel',q:'그때 내 마음은 어땠어?',t:'multi',o:FEEL,face:1,w:'내 마음을 내 말로 써 봐'},
 {k:'wish',q:'친구가 이렇게 해 주면 좋겠어',t:'multi',o:WISH,w:'친구에게 바라는 걸 써 봐'},

 {k:'good',q:'이 친구의 좋은 점도 있을까?',sub:'좋은 점을 함께 전하면 친구가 이야기를 더 잘 들을 수 있어.',t:'multi',o:GOOD,w:'친구의 좋은 점을 써 봐'},
 {k:'text',q:'더 하고 싶은 말이 있으면 써 줘',sub:'안 써도 괜찮아. 이 말은 선생님만 봐.',t:'text'},
 {k:'share',q:'선생님이 이 이야기를 친구에게 전해도 될까?',sub:'어떤 걸 골라도 괜찮아.',t:'one',o:SHARE}
];
const B=[
 {t:'read',q:'먼저 네 이야기를 듣고 싶어',h:()=>`<div class="say good">누가 잘못했는지 정하려는 자리가 아니야. 체육 시간에 모두 편하게 참여하려면 무엇을 바꾸면 좋을지 같이 알아보자.</div>`+(S.note?`<div class="say good">선생님: ${esc(S.note)}</div>`:'')},
 {k:'pe_good',q:'체육 시간에 너는 어떤 점이 좋아?',t:'multi',o:['친구들과 같이 뛰는 게 좋아','이기는 게 좋아','작전 짜는 게 좋아','몸을 움직이는 게 좋아','잘 모르겠어'],w:'체육 시간에 좋은 점을 써 봐'},
 {k:'pe_hard',q:'체육 시간에 답답했던 적이 있어?',t:'multi',o:['친구들이 의견을 말하지 않을 때','열심히 안 하는 것 같을 때','규칙을 안 지킬 때','우리 팀이 지고 있을 때','별로 없어'],w:'답답했던 일을 써 봐'},
 {t:'read',q:'친구들이 말한 너의 좋은 점',h:()=>readGood()},
 {t:'read',q:'그런데 친구들은 이럴 때 마음이 힘들었대',h:()=>readHard()},
 {t:'read',q:'친구들이 이렇게 해 주면 좋겠대',h:()=>readWish()},
 {k:'feel',q:'이 이야기를 들으니 내 마음은?',t:'multi',o:B_FEEL,face:1,w:'내 마음을 내 말로 써 봐'},
 {k:'why',q:'그때 나는 사실…',sub:'네 마음도 선생님이 듣고 싶어.',t:'multi',o:B_WHY,w:'그때 내 마음이나 이유를 써 봐'},
 {k:'prom',q:'내가 해 볼 약속을 골라 줘',sub:'한두 개만 골라도 충분해.',t:'multi',o:B_PROM,max:2,w:'내가 만든 약속을 써 봐'},
 {k:'wish',q:'나도 친구들에게 바라는 게 있어',t:'multi',o:B_WISH,w:'친구들에게 바라는 걸 써 봐'}
];

const CFG={apiKey:"AIzaSyDaIRTcQbxfp_gQUAX3gLu3tnjkm_fsuw4",authDomain:"school-counsel.firebaseapp.com",databaseURL:"https://school-counsel-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"school-counsel",storageBucket:"school-counsel.firebasestorage.app",messagingSenderId:"1088686876670",appId:"1:1088686876670:web:accd834c1f8dfcdeb602af"};
const T_EMAIL='zpr1120@gmail.com';
let S={stories:[],note:'',picked:false,pick:{what:[],wish:[]},boy:null};
let fb=null,user=null,listening=false,loaded=false,sending=false;
const arr=x=>Array.isArray(x)?x.filter(v=>v!=null):(x&&typeof x==='object'?Object.values(x):(x?[x]:[]));
const AK=['when','what','feel','wish','mine','good','prom','why','pe_good','pe_hard'];

 fb.auth.getRedirectResult().catch(e=>toast('로그인하지 못했어요'));
 fb.auth.onAuthStateChanged(u=>{user=u;if(isT())listen();else unlisten();if(['teacher','card','pin'].includes(view))render()});
}catch(e){fb=null}
function listen(){if(listening)return;listening=true;
 fb.db.ref('stories').on('value',snap=>{const v=snap.val()||{},prev=S.stories.length;S.stories=Object.entries(v).map(([id,s])=>({...norm(s),id})).sort((a,b)=>a.at<b.at?-1:1);
  if(loaded&&S.stories.length>prev)toast('새 이야기가 도착했어요');loaded=true;if(['teacher','card'].includes(view)&&!typing())render()},e=>toast('기록을 읽을 권한이 없어요'));
 fb.db.ref('teacher/state').on('value',snap=>{const v=snap.val()||{};S.note=v.note||'';S.follow=v.follow||'';S.picked=!!v.picked;

 if(!fb){toast('인터넷 연결을 확인해 줘');return}

async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}

async function makeCard(){
 const c=cardText(),h=hd(),W=1080,P=72,font='"Gowun Dodum",sans-serif',jua='Jua,"Gowun Dodum",sans-serif';
 const secs=[{t:h.a,items:c.prom,col:'#e2553d',bg:'#ffe9e2'},{t:h.b,items:c.bw,col:'#1f5f6b',bg:'#e3f1f3'},{t:'친구들의 약속',items:c.mine,col:'#b8742a',bg:'#fff1d6'}];
 const follow=((S.follow||'').trim()||'일주일 뒤에 선생님과 다시 이야기 나눠요.');
 const all='우리의 약속 카드 잘 지킨 점을 먼저 찾아봐요 마음 다리 함께 정해요 선생님과 '+secs.map(x=>x.t+x.items.join('')).join('')+follow+c.date+'0123456789.·';
 try{await Promise.all([document.fonts.load('64px Jua',all),document.fonts.load('40px "Gowun Dodum"',all)])}catch(e){}
 const cv=document.createElement('canvas'),x=cv.getContext('2d');
 const wrap=(t,f,max)=>{x.font=f;const out=[];let line='';for(const ch of String(t)){const tl=line+ch;if(x.measureText(tl).width>max&&line){const sp=line.lastIndexOf(' ');if(sp>line.length*0.5&&ch!==' '){out.push(line.slice(0,sp));line=line.slice(sp+1)+ch}else{out.push(line);line=ch.trim()}}else line=tl}if(line)out.push(line);return out};
 const BF='40px '+font,HF='44px '+jua,LH=58,IW=W-P*2-56-40;
 const lay=secs.map(sc=>{const ht=wrap(sc.t,HF,W-P*2-56);const items=(sc.items.length?sc.items:['선생님과 함께 정해요']).map(it=>wrap(it,BF,IW));const n=items.reduce((a,b)=>a+b.length,0);return {...sc,ht,items,h:40+ht.length*56+16+n*LH+(items.length-1)*14+36}});
 const fl=wrap(follow+' 잘 지킨 점을 먼저 찾아봐요.',BF,W-P*2);
 const HEAD=430,H=HEAD+lay.reduce((a,b)=>a+b.h+28,0)+fl.length*LH+150;
 cv.width=W;cv.height=H;
 x.fillStyle='#fff4e8';x.fillRect(0,0,W,H);
 const g=x.createLinearGradient(0,0,0,HEAD);g.addColorStop(0,'#ffcfa6');g.addColorStop(1,'#fff0e0');x.fillStyle=g;x.fillRect(0,0,W,HEAD);
 x.fillStyle='#ffb27d';x.beginPath();x.arc(W-150,110,62,0,7);x.fill();
 x.fillStyle='#f08a6b';x.beginPath();x.moveTo(0,HEAD);x.lineTo(0,300);x.quadraticCurveTo(160,250,340,300);x.lineTo(340,HEAD);x.fill();
 x.fillStyle='#3f8692';x.beginPath();x.moveTo(W,HEAD);x.lineTo(W,300);x.quadraticCurveTo(W-160,250,W-340,300);x.lineTo(W-340,HEAD);x.fill();
 x.fillStyle='#8cc9d1';x.fillRect(340,HEAD-70,W-680,70);
 x.strokeStyle='#7a4a3a';x.lineWidth=16;x.lineCap='round';x.beginPath();x.moveTo(320,312);x.quadraticCurveTo(W/2,190,W-320,312);x.stroke();
 const hx=W/2,hy=236;x.fillStyle='#e2553d';x.beginPath();x.moveTo(hx,hy+26);x.bezierCurveTo(hx-46,hy-6,hx-24,hy-44,hx,hy-18);x.bezierCurveTo(hx+24,hy-44,hx+46,hy-6,hx,hy+26);x.fill();
 x.fillStyle='#2d2522';x.textBaseline='top';x.font='76px '+jua;x.fillText('우리의 약속 카드',P,64);
 x.font='36px '+font;x.fillStyle='#6b5a52';x.fillText(c.date+' · 마음 다리',P,160);
 let y=HEAD+30;
 const rr=(X,Y,w,h,r)=>{x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath()};
 lay.forEach(sc=>{rr(P,y,W-P*2,sc.h,32);x.fillStyle=sc.bg;x.fill();
  let yy=y+40;x.fillStyle=sc.col;x.font=HF;sc.ht.forEach(l=>{x.fillText(l,P+28,yy);yy+=56});yy+=16;
  x.font=BF;sc.items.forEach(lines=>{x.fillStyle=sc.col;x.beginPath();x.arc(P+44,yy+24,9,0,7);x.fill();x.fillStyle='#2d2522';lines.forEach(l=>{x.fillText(l,P+76,yy);yy+=LH});yy+=14});
  y+=sc.h+28});
 x.fillStyle='#6b5a52';x.font=BF;fl.forEach(l=>{x.fillText(l,P,y+10);y+=LH});
 x.fillStyle='#e2553d';x.font='32px '+jua;x.fillText('♥ 마음 다리',P,H-80);
 return new Promise(r=>cv.toBlob(r,'image/png'));
}

 const file=new File([blob],name,{type:'image/png'}),canShare=!!(navigator.canShare&&navigator.canShare({files:[file]}));
 const w=document.createElement('div');w.className='imgw';
 w.innerHTML=`<div><img alt="약속 카드 이미지" src="${url}"><div class="row2"><a class="btn" href="${url}" download="${esc(name)}" style="text-decoration:none;display:inline-flex;align-items:center">이미지 저장</a>${canShare?'<button class="btn sup" data-s>보내기</button>':''}<button class="btn ghost sm" data-c>닫기</button></div><p class="mut">이미지를 저장해서 학생 태블릿이나 클래스 앱으로 보내 주세요.</p></div>`;
 w.addEventListener('click',async e=>{if(e.target===w||e.target.closest('[data-c]')){w.remove();URL.revokeObjectURL(url)}else if(e.target.closest('[data-s]')){try{await navigator.share({files:[file],title:'우리의 약속 카드'})}catch(err){}}});
 document.body.appendChild(w);
}
let cardName='';
const hd=()=>{const n=cardName.trim()||'나';return {a:`${n}의 약속`,b:`${n}의 바람: 친구들이 이렇게 해 주면 좋겠어`}};
function cardHTML(){
 const c=cardText(),li=a=>a.length?`<ul>${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<p class="mut">선생님과 함께 정해요</p>';
 return `<div class="pcard"><div><h2>우리의 약속 카드</h2><p class="mut">${esc(c.date)} · 체육 시간을 모두에게 즐겁게</p></div>
 <label class="wl" for="cname">카드에 넣을 이름 <span class="mut">(안 쓰면 '나'로 나와요)</span></label><input id="cname" class="cname" value="${esc(cardName)}" placeholder="예: 민준" maxlength="10">
 <div class="cols"><div><h3 id="h1">${esc(hd().a)}</h3>${li(c.prom)}</div><div><h3 id="h2">${esc(hd().b)}</h3>${li(c.bw)}</div><div><h3>친구들의 약속</h3>${li(c.mine)}</div></div>
 <details><summary>선생님만 보기: 대화한 친구의 마음과 이야기</summary><h3 style="margin-top:8px">체육 시간에 좋은 점</h3>${li(c.pg)}<h3>답답했던 점</h3>${li(c.ph)}<h3>이야기를 들은 마음</h3>${li(c.feel)}<h3>사실은…</h3>${li(c.why)}</details>
 <p class="mut">${esc((S.follow||'').trim()||'일주일 뒤에 선생님과 다시 이야기 나눠요.')} 잘 지킨 점을 먼저 찾아봐요.</p></div>
 <div class="row2" style="margin-top:18px"><button class="btn" data-act="img">카드 이미지 만들기</button><button class="btn sup sm" data-act="copy">글로 복사하기</button><button class="btn ghost sm" data-act="teacher">선생님 정리로</button></div>`;
}

function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
function go(v){if((v==='teacher'||v==='card')&&!authed)v='pin';if(v==='home')authed=false;view=v;render();scrollTo(0,0)}

app.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act;
 if(a!=='wipe')wipeArm=false;
 if(a==='girl'){authed=false;startFlow(G,'g')}
 else if(a==='boy')startFlow(B,'b');
 else if(a==='home'||a==='quit'){const toT=a==='quit'&&flow&&flow.who==='b';flow=null;go(toT?'teacher':'home')}
 else if(a==='chip'){const st=flow.steps[flow.i],o=st.o[+b.dataset.j];
  if(st.t==='one')flow.d[st.k]=o;
  else{let v=flow.d[st.k]||[];if(v.includes(o))v=v.filter(x=>x!==o);else{if(st.max&&v.length>=st.max){toast(`${st.max}개까지 고를 수 있어`);return}v=[...v,o]}flow.d[st.k]=v}
  render()}
 else if(a==='prev'){flow.i--;render();scrollTo(0,0)}
 else if(a==='next'){
  if(flow.i<flow.steps.length-1){flow.i++;render();scrollTo(0,0);return}
  const d={...flow.d,at:new Date().toISOString()};
  if(flow.who==='g'){sendStory(d)}else{S.boy=d;setState({boy:clean(d)});flow=null;go('card')}}
 else if(a==='teacher')go('teacher');
 else if(a==='pk')pinKey(b.dataset.k);
 else if(a==='img')showCard();
 else if(a==='sum'){const sh=shared(),f=(k,x)=>{const a=union(k,sh);return a.length?a.map(y=>'- '+y).join('\n'):'- (더 확인해 보기)'};
  const txt=`친구 관계 대화 요약 (이름·발언자 없이 정리)\n\n[자주 나온 상황]\n${f('when')}\n\n[힘들었던 일]\n${f('what')}\n\n[친구들이 바라는 것]\n${f('wish')}\n\n[친구들이 스스로 해 볼 것]\n${f('mine').replace('- 아직 잘 모르겠어\n','')}\n\n[친구의 좋은 점]\n${f('good')}\n\n※ 전달에 동의한 이야기만 모았어요. 직접 쓴 글은 빠져 있어요.`;
  try{navigator.clipboard.writeText(txt).then(()=>toast('요약을 복사했어요'),()=>toast('복사가 막혀 있어요'))}catch(err){toast('복사가 막혀 있어요')}}
 else if(a==='card')go('card');
 else if(a==='del'){if(isT())fb.db.ref('stories/'+b.dataset.i).remove()}
 else if(a==='glogin'){const pr=new firebase.auth.GoogleAuthProvider();pr.setCustomParameters({login_hint:T_EMAIL,prompt:'select_account'});fb.auth.signInWithPopup(pr).catch(e=>{if(e&&(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment'))fb.auth.signInWithRedirect(pr);else toast('로그인하지 못했어요')})}
 else if(a==='glogout'){fb.auth.signOut();go('home')}
 else if(a==='sample'){const t=new Date().toISOString();S.stories=[
  {ani:ANI[0],when:[WHEN[0],WHEN[1]],what:[WHAT[0],WHAT[3]],feel:[FEEL[2]],wish:[WISH[0],WISH[3]],mine:[MINE[1]],good:[GOOD[0],GOOD[1]],text:'',share:SHARE[0],at:t},
  {ani:ANI[3],when:[WHEN[2]],what:[WHAT[1],WHAT[2]],feel:[FEEL[0],FEEL[4]],wish:[WISH[2],WISH[1]],mine:[MINE[2]],good:[GOOD[2]],text:'공 놓쳤을 때 소리 질러서 그 뒤로 체육이 싫어졌어요',share:SHARE[0],at:t},
  {ani:ANI[5],when:[WHEN[3]],what:[WHAT[5]],feel:[FEEL[1]],wish:[WISH[5]],mine:[MINE[4]],good:[GOOD[6]],text:'',share:SHARE[1],at:t}];S.stories.forEach(x=>{x.uid=user.uid;fb.db.ref('stories').push(clean(x))});S.stories=[];setState({picked:false})}
 else if(a==='wipe'){if(!wipeArm){wipeArm=true;render();return}wipeArm=false;if(isT()){fb.db.ref('stories').remove();fb.db.ref('teacher').remove()}render();toast('모두 지웠어요')}
 else if(a==='copy'){const c=cardText(),f=x=>x.length?x.map(y=>'- '+y).join('\n'):'- (함께 정하기)';
  const txt=`우리의 약속 카드 (${c.date})\n\n[${hd().a}]\n${f(c.prom)}\n\n[${hd().b}]\n${f(c.bw)}\n\n[친구들의 약속]\n${f(c.mine)}`;
  try{navigator.clipboard.writeText(txt).then(()=>toast('복사했어요'),()=>toast('복사가 막혀 있어요'))}catch(err){toast('복사가 막혀 있어요')}}
});
app.addEventListener('input',e=>{
 if(e.target.id==='tx'&&flow)flow.d.text=e.target.value;
 if(e.target.id==='w'&&flow){const st=flow.steps[flow.i];flow.d[st.k+'_t']=e.target.value;const nb=app.querySelector('[data-act=next]');if(nb)nb.disabled=!valid(st)}
 if(e.target.id==='cname'){cardName=e.target.value;const h=hd(),a1=document.getElementById('h1'),a2=document.getElementById('h2');if(a1)a1.textContent=h.a;if(a2)a2.textContent=h.b}
 if(e.target.id==='note'){S.note=e.target.value;debState({note:S.note})}
 if(e.target.id==='follow'){S.follow=e.target.value;debState({follow:S.follow})}
});
app.addEventListener('change',e=>{
 const k=e.target.dataset.pick;if(!k)return;
 if(!S.picked){S.pick={what:pickOf('what'),wish:pickOf('wish')};S.picked=true}
 const v=e.target.value;S.pick[k]=e.target.checked?[...new Set([...S.pick[k],v])]:S.pick[k].filter(x=>x!==v);setState({picked:true,pick:clean(S.pick)});
});
render();
}
</script>
</body>
</html>
